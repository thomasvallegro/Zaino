<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Zaino</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barra in alto: titolo della schermata e pulsante "indietro" -->
  <header class="barra">
    <a id="indietro" class="indietro" href="#/" hidden>‹ Indietro</a>
    <h1 id="titolo">Zaino</h1>
  </header>

  <!-- Avviso "tasca attiva" (dopo aver letto il tag di una tasca) -->
  <div id="tasca-attiva" class="banner" hidden></div>

  <!-- Qui JavaScript disegna la schermata corrente -->
  <main id="app"></main>

  <!-- Messaggio temporaneo (es. "Penna → Tasca frontale") -->
  <div id="toast" class="toast" hidden></div>

  <!-- Menu in basso -->
  <nav class="menu">
    <a href="#/" data-sezione="zaini">🎒 Zaini</a>
    <a href="#/inventario" data-sezione="inventario">📦 Inventario</a>
    <a href="#/impostazioni" data-sezione="impostazioni">⚙️ Backup</a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
