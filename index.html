<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c11">
  <meta name="apple-mobile-web-app-title" content="Zaino">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icona.png">
  <link rel="icon" href="icona.png">
  <title>Zaino</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barra di navigazione in stile iOS: indietro · titolo piccolo · azione -->
  <header class="nav">
    <div class="nav-sx"><button id="btn-menu" class="btn-menu" data-azione="menu" aria-label="Menu" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"/></svg></button><a id="indietro" class="link-nav" href="#/" hidden></a></div>
    <div class="nav-titolo" id="nav-titolo"></div>
    <div class="nav-dx" id="nav-dx"></div>
  </header>

  <!-- Stato della sincronizzazione (offline / salvataggio) -->
  <div id="sync" class="sync" hidden></div>

  <!-- Avviso "tasca attiva" (dopo aver letto il tag di una tasca) -->
  <div id="tasca-attiva" class="banner" hidden></div>

  <!-- Qui JavaScript disegna la schermata corrente -->
  <main id="app"></main>

  <!-- Messaggio temporaneo -->
  <div id="toast" class="toast" hidden></div>

  <!-- Barra delle schede in basso -->
  <nav class="tabbar" id="tabbar"></nav>

  <!-- Pannello che sale dal basso (creazione / modifica) -->
  <dialog id="sheet" class="sheet"><div class="sheet-corpo"></div></dialog>

  <!-- Richiesta di conferma (es. "Eliminare?") -->
  <dialog id="conferma" class="sheet azione"><div class="sheet-corpo"></div></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
